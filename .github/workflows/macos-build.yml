name: macOS native compatibility
on:
  workflow_dispatch:
  push:
    paths: ['App.tsx', 'src/**', 'macos/**', 'package*.json', '*.config.js', '.github/workflows/macos-build.yml']
permissions:
  contents: read
concurrency:
  group: macos-compatibility-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60
    env:
      RCT_NEW_ARCH_ENABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Install macOS native dependencies
        run: pod install --project-directory=macos
      - name: Build unsigned native app
        shell: bash
        run: |
          set -o pipefail
          xcodebuild -workspace macos/binder-copy-desktop.xcworkspace -scheme binder-copy-desktop-macOS -configuration Release -destination 'platform=macOS,arch=arm64' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build 2>&1 | tee build-output.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-compatibility-evidence
          path: |
            build-output.log
            macos/Podfile.lock
          retention-days: 7
